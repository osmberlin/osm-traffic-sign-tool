[install]
# Port of pnpm-workspace.yaml minimumReleaseAge: 7200 (minutes) → seconds (5 days).
minimumReleaseAge = 432000
# attw 0.18.3 fixes fflate 0.8.3 tarball unpack (https://github.com/arethetypeswrong/arethetypeswrong.github.io/issues/258)
minimumReleaseAgeExcludes = ["@arethetypeswrong/cli", "@arethetypeswrong/core"]
# No global virtual store here (overrides `globalStore = true` in ~/.bunfig.toml): bun-types
# imports `undici-types` without declaring it, which only resolves in a project-local store.
# In the global store `Response`/`Headers` lose their types (`'ok' does not exist on type
# 'Response'`) in the Node scripts of packages/internal_*. CI does not use the global store.
globalStore = false
