# Netlify deploy previews for pull requests only (except Dependabot).
#
# Builds from the monorepo root so workspace packages (@osm-traffic-signs/converter,
# @internal/*) are linked from the checked-in source — not from npm releases.
#
# Production deploys stay on GitHub Pages (.github/workflows/app-traffic-sign-tool-deploy.yml).

[build]
# Node: .nvmrc (also mirrored in package.json engines.node)
# Bun: package.json packageManager + bun.lock (Netlify runs bun install when bun.lock is present)
command = "bun run build"
publish = "apps/traffic-sign-tool/dist"
# Exit 0 = skip. Build deploy previews only; skip main pushes and Dependabot PRs.
# Netlify: exit 0 cancels, exit 1 proceeds. BRANCH is the PR branch (dependabot/*).
ignore = "bash -c '[[ \"$CONTEXT\" != deploy-preview ]] && exit 0; [[ \"$BRANCH\" == dependabot/* ]] && exit 0; exit 1'"

[build.environment]
# bunfig.toml enables Bun's global virtual store for local dev. Keep Netlify on a project-local
# node_modules so its dependency cache does not hold symlinks into ~/.bun/install/cache/links.
BUN_INSTALL_GLOBAL_STORE = "0"

# TanStack Router SPA — serve index.html for client-side routes.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
