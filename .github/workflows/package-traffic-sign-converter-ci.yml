# See https://www.totaltypescript.com/how-to-create-an-npm-package#8-set-up-our-ci-with-github-actions
name: Monorepo CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          # See ./NODE_VERSION.md
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Build packages (for app type-check)
        run: bun run build:packages && bun run --cwd apps/traffic-sign-tool build:paraglide

      - name: Run checks (all workspaces)
        run: bun run --filter '*' check
